[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sat-downloaders"
dynamic = ["version"]
dependencies = [
  "requests",
  "stream-unzip",
  "eumdac"
]
requires-python = ">=3.10"
authors = [
  {name = "Martin Raspaud", email = "martin.raspaud@smhi.se"}
]

description = ""
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[tool.hatch.version]
source = "vcs"
